<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#f4e2a1"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6d12"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="256" cy="236" r="150"/>
    </clipPath>
  </defs>

  <!-- background plate -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0e1726"/>

  <!-- outer halo -->
  <circle cx="256" cy="236" r="212" fill="url(#halo)"/>

  <!-- torus: the periodic universe, opened at the cut-off -->
  <circle cx="256" cy="236" r="176" fill="none" stroke="#1f3350" stroke-width="26"/>
  <path d="M 256 60 A 176 176 0 0 1 396.1 324.9"
        fill="none" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
  <path d="M 256 412 A 176 176 0 0 1 115.9 147.1"
        fill="none" stroke="#c9a227" stroke-width="7" stroke-linecap="round" opacity="0.45"/>

  <!-- the gap: r_c, where gravity switches off -->
  <circle cx="396.1" cy="324.9" r="9" fill="#0e1726" stroke="#c9a227" stroke-width="5"/>
  <circle cx="115.9" cy="147.1" r="9" fill="#0e1726" stroke="#c9a227" stroke-width="5" opacity="0.55"/>

  <!-- granular interior: matter condensing under a modified force -->
  <g clip-path="url(#disc)">
    <circle cx="256" cy="236" r="150" fill="#0b1220"/>
    <g fill="#c9a227">
      <circle cx="256" cy="236" r="15" opacity="0.95"/>
      <circle cx="300" cy="212" r="9" opacity="0.75"/>
      <circle cx="214" cy="262" r="10" opacity="0.8"/>
      <circle cx="286" cy="288" r="7" opacity="0.6"/>
      <circle cx="226" cy="196" r="6" opacity="0.6"/>
      <circle cx="330" cy="262" r="5" opacity="0.45"/>
      <circle cx="180" cy="226" r="5" opacity="0.45"/>
      <circle cx="262" cy="316" r="5" opacity="0.4"/>
      <circle cx="248" cy="160" r="4" opacity="0.4"/>
      <circle cx="344" cy="206" r="4" opacity="0.3"/>
      <circle cx="168" cy="286" r="4" opacity="0.3"/>
      <circle cx="306" cy="330" r="3.5" opacity="0.28"/>
      <circle cx="196" cy="322" r="3.5" opacity="0.28"/>
      <circle cx="352" cy="298" r="3" opacity="0.22"/>
      <circle cx="160" cy="192" r="3" opacity="0.22"/>
      <circle cx="286" cy="152" r="3" opacity="0.2"/>
      <circle cx="222" cy="356" r="3" opacity="0.2"/>
      <circle cx="366" cy="238" r="2.4" opacity="0.16"/>
      <circle cx="146" cy="250" r="2.4" opacity="0.16"/>
      <circle cx="256" cy="122" r="2.4" opacity="0.16"/>
      <circle cx="256" cy="350" r="2.4" opacity="0.16"/>
    </g>
  </g>

  <!-- accretion ring -->
  <circle cx="256" cy="236" r="150" fill="none" stroke="url(#core)" stroke-width="3.5"/>

  <!-- scale bar: one decade of the gap -->
  <line x1="196" y1="446" x2="316" y2="446" stroke="#3c5170" stroke-width="2"/>
  <line x1="196" y1="440" x2="196" y2="452" stroke="#3c5170" stroke-width="2"/>
  <line x1="256" y1="440" x2="256" y2="452" stroke="#3c5170" stroke-width="2"/>
  <line x1="316" y1="440" x2="316" y2="452" stroke="#3c5170" stroke-width="2"/>

  <!-- wordmark -->
  <text x="256" y="484" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" letter-spacing="11" fill="#e8eef7">RATISS</text>
</svg>
